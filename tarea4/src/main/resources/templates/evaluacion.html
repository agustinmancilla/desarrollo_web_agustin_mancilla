<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos de Adopción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container mt-4">        
        <h1 class="text-center mb-4">Avisos de Adopción</h1>
        <div>
            <table class="mi-tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha Publicación</th>
                        <th>Sector</th>
                        <th>Cantidad, Tipo y Edad</th>
                        <th>Comuna</th>
                        <th>Promedio Notas</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aviso : ${avisos}">
                        <td th:text="${aviso.id}"></td>
                        <td th:text="${aviso.fecha_publicacion}"></td>
                        <td>
                            <span th:if="${aviso.sector != null and aviso.sector != ''}" th:text="${aviso.sector}"></span>
                            <span th:if="${aviso.sector == null or aviso.sector == ''}" class="text-muted">No especificado</span>
                        </td>
                        <td>
                            <span th:text="${aviso.cantidad}"></span>
                            <span th:text="${aviso.tipo}"></span>
                            <span th:text="${aviso.edad}"></span>
                            <span th:if="${aviso.unidad_medida == 'm'}">meses</span>
                            <span th:if="${aviso.unidad_medida == 'a'}">años</span>
                        </td>
                        <td th:text="${aviso.comuna}"></td>
                        <td>
                            <span th:if="${aviso.promedio_notas != 'nu'}" 
                                  th:text="${aviso.promedio_notas}" ></span>
                            <span th:if="${aviso.promedio_notas == 'nu'}" 
                                  class="text-muted">-</span>
                        </td>
                        <td>
                            <span class="text-primary text-decoration-underline" style="cursor:pointer;">evaluar</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
<script th:src="@{/js/evaluar.js}"></script>
</html>
